name: Scheduled Threads Post

on:
  schedule:
    # GitHub Actions の schedule はベストエフォートで遅延・ドロップする。
    # 各枠を「主＋予備2回」の計3回発火させ、1発落ちても後続が拾う冗長構成にする。
    # スクリプト側の冪等ガード（日×枠で1回だけ投稿）が二重投稿を防ぐ。
    # X とは時間差をつけて自然な投稿リズムに。発火間隔は 35〜40分。
    # --- 朝 JST 07:20/07:55/08:35 = UTC 22:20/22:55/23:35（前日扱い）---
    - cron: '20 22 * * *'
    - cron: '55 22 * * *'
    - cron: '35 23 * * *'
    # --- 昼 JST 12:20/12:55/13:35 = UTC 03:20/03:55/04:35 ---
    - cron: '20 3 * * *'
    - cron: '55 3 * * *'
    - cron: '35 4 * * *'
    # --- 夜 JST 19:20/19:55/20:35 = UTC 10:20/10:55/11:35 ---
    - cron: '20 10 * * *'
    - cron: '55 10 * * *'
    - cron: '35 11 * * *'

  workflow_dispatch:

# 同一ワークフローの多重起動を直列化（冗長クロンが重なっても二重投稿しない保険）
concurrency:
  group: scheduled-threads-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run threads poster
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          TZ: Asia/Tokyo
          # 起動した cron からスロットを固定する（GitHub の発火時刻ズレ対策）。
          # 各枠3本の cron すべてを同じスロットへマップ。手動dispatchは空→時計判定にフォールバック。
          POST_SLOT: ${{ (github.event.schedule == '20 22 * * *' || github.event.schedule == '55 22 * * *' || github.event.schedule == '35 23 * * *') && '朝' || (github.event.schedule == '20 3 * * *' || github.event.schedule == '55 3 * * *' || github.event.schedule == '35 4 * * *') && '昼' || (github.event.schedule == '20 10 * * *' || github.event.schedule == '55 10 * * *' || github.event.schedule == '35 11 * * *') && '夜' || '' }}
        run: python scripts/threads_poster.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add storage/stocks/pending.md storage/stocks/posted.md storage/analytics/scheduler.log storage/analytics/post-state.json
          if ! git diff --cached --quiet; then
            git commit -m "auto: post threads at $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M JST')"
            git push
          else
            echo "No changes to commit (post might have been skipped for this slot)."
          fi
