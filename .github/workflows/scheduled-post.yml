name: Scheduled Threads Post

# === 送信専用ワークフロー（GitHub cron は廃止）===
# 配信の「時計」はクラウドRoutineが持つ。Routine が定時に投稿文を生成して
# pending.md を push した瞬間に、このワークフローが起動して Threads へ送信する。
#
# なぜ cron を捨てたか:
#   GitHub Actions の schedule cron は発火が数時間ズレ・ドロップし、
#   投稿が深夜に固まる/日中が空になる事故を起こしたため（2026-06-03 に確認）。
#   「いつ投稿するか」は正確な時計を持つRoutineがpushタイミングでConfigし、
#   GitHub Actions は「Secretsを使って確実に送る」エンジンに徹する。
on:
  push:
    branches: [main]
    paths:
      - 'storage/stocks/pending.md'   # Routine が1本積んだ時だけ起動
  workflow_dispatch:                  # 手動送信（緊急の取りこぼし救済など）

# 多重起動を直列化（保険）
concurrency:
  group: scheduled-threads-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    # 無限ループ防止: poster 自身の「投稿済みに移動」コミット([skip-send]入り)では起動しない。
    # workflow_dispatch には head_commit が無いので常に通す。
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip-send]') }}
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Send the queued post
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          TZ: Asia/Tokyo
          # 時計はRoutineが正確に持つので、poster は実行時刻=正しいスロットで判定してよい
          # （旧 POST_SLOT ハックは不要）。直投稿なのでジッターも切る。
          SKIP_JITTER: "1"
        run: python scripts/threads_poster.py

      - name: Commit and push result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add storage/stocks/pending.md storage/stocks/posted.md storage/analytics/scheduler.log storage/analytics/post-state.json
          if ! git diff --cached --quiet; then
            # [skip-send] を付けて、この結果コミットの push で自分自身を再起動しないようにする。
            git commit -m "auto: sent Threads post at $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M JST') [skip-send]"
            git push
          else
            echo "No changes to commit (nothing was queued to send)."
          fi
