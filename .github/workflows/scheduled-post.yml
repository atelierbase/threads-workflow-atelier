name: Scheduled Threads Post

on:
  schedule:
    # GitHub Actions の cron は UTC 基準・X とは時間差15分つけて自然な投稿リズムに
    # JST 07:20 = UTC 22:20（前日扱い）
    # JST 12:20 = UTC 03:20
    # JST 19:20 = UTC 10:20
    - cron: '20 22 * * *'
    - cron: '20 3 * * *'
    - cron: '20 10 * * *'

  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run threads poster
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          TZ: Asia/Tokyo
          # 起動した cron からスロットを固定する（GitHub の発火時刻ズレ対策）。
          # 20 22→朝 / 20 3→昼 / 20 10→夜。手動dispatchは空→スクリプトが時計判定にフォールバック。
          POST_SLOT: ${{ github.event.schedule == '20 22 * * *' && '朝' || github.event.schedule == '20 3 * * *' && '昼' || github.event.schedule == '20 10 * * *' && '夜' || '' }}
        run: python scripts/threads_poster.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add storage/stocks/pending.md storage/stocks/posted.md storage/analytics/scheduler.log
          if ! git diff --cached --quiet; then
            git commit -m "auto: post threads at $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M JST')"
            git push
          else
            echo "No changes to commit (post might have been skipped for this slot)."
          fi
