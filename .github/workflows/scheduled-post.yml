name: Scheduled Threads Image2 Post

# === image2生成済み画像の送信専用ワークフロー ===
# 画像生成は行わない。ChatGPT image2で作成し、repo にコミット済みの
# storage/images/{投稿ID}.png を pending.md から参照して投稿する。
# PCを閉じていても GitHub Actions が指定スロットで送信する。
on:
  schedule:
    # GitHub cron is UTC. These are JST 07:20 / 12:20 / 19:20.
    - cron: '20 22 * * *'
    - cron: '20 3 * * *'
    - cron: '20 10 * * *'
  workflow_dispatch:                  # 手動送信（緊急の取りこぼし救済など）
    inputs:
      slot:
        description: '送信する投稿枠'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - 朝
          - 昼
          - 夜

# 多重起動を直列化（保険）
concurrency:
  group: scheduled-threads-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    # schedule では pending.md に該当スロットの image2投稿が無ければ no-op。
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Resolve slot
        id: slot
        env:
          DISPATCH_SLOT: ${{ github.event.inputs.slot }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          slot="$DISPATCH_SLOT"
          if [ -z "$slot" ] || [ "$slot" = "auto" ]; then
            case "$EVENT_SCHEDULE" in
              "20 22 * * *") slot="朝" ;;
              "20 3 * * *") slot="昼" ;;
              "20 10 * * *") slot="夜" ;;
              *)
                hour="$(TZ=Asia/Tokyo date +%H)"
                if [ "$hour" -ge 6 ] && [ "$hour" -le 10 ]; then
                  slot="朝"
                elif [ "$hour" -ge 11 ] && [ "$hour" -le 14 ]; then
                  slot="昼"
                else
                  slot="夜"
                fi
                ;;
            esac
          fi
          echo "slot=$slot" >> "$GITHUB_OUTPUT"

      - name: Send the queued post
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          TZ: Asia/Tokyo
          POST_SLOT: ${{ steps.slot.outputs.slot }}
          REQUIRE_IMAGE: "1"
          SKIP_JITTER: "1"
        run: python scripts/threads_poster.py

      - name: Commit and push result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add storage/stocks/pending.md storage/stocks/posted.md storage/analytics/scheduler.log storage/analytics/post-state.json
          if ! git diff --cached --quiet; then
            # [skip-send] を付けて、この結果コミットの push で自分自身を再起動しないようにする。
            git commit -m "auto: sent Threads post at $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M JST') [skip-send]"
            git push
          else
            echo "No changes to commit (nothing was queued to send)."
          fi
